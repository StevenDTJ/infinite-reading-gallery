<main class="reading-gallery-shell" aria-label="无限书场">
  <section class="reading-gallery-viewport" data-gallery-viewport>
    <div class="reading-gallery-camera">
      <div class="reading-gallery-canvas" data-gallery-canvas></div>
    </div>

    <div class="reading-gallery-plaque" aria-label="无限书场">
      <span>READING ROOM</span>
      <strong>无限书场</strong>
    </div>

    <div class="reading-gallery-search" data-gallery-search>
      <button
        type="button"
        class="reading-gallery-count"
        data-gallery-action="catalog"
        aria-expanded="false"
        aria-controls="reading-gallery-catalog"
      >
        <b data-gallery-count>0</b>
        <span>EPUB / ARCHIVE</span>
        <i aria-hidden="true">↓</i>
      </button>
      <div
        id="reading-gallery-catalog"
        class="reading-gallery-catalog"
        data-gallery-catalog
        aria-label="搜索与定位"
        aria-hidden="true"
      >
        <div class="reading-gallery-catalog-heading">
          <b>SEARCH</b>
          <span>搜索与定位</span>
        </div>
        <div class="reading-gallery-catalog-list" data-gallery-catalog-list></div>
      </div>
    </div>

    <div class="reading-gallery-hint" aria-hidden="true">
      <span>HOLD</span><b>&amp;</b><span>DRAG</span>
    </div>

    <div class="reading-gallery-pointer" data-gallery-pointer aria-hidden="true">
      <i>↖</i><i>↗</i><i>↙</i><i>↘</i><b></b>
    </div>

    <div class="reading-gallery-marquee" aria-hidden="true">
      <div class="reading-gallery-edge reading-gallery-edge-top" data-gallery-edge="top"><span></span><span></span></div>
      <div class="reading-gallery-edge reading-gallery-edge-right" data-gallery-edge="right"><span></span><span></span></div>
      <div class="reading-gallery-edge reading-gallery-edge-bottom" data-gallery-edge="bottom"><span></span><span></span></div>
      <div class="reading-gallery-edge reading-gallery-edge-left" data-gallery-edge="left"><span></span><span></span></div>
    </div>
  </section>
</main>
